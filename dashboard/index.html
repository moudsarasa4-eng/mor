<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electricista OS</title>
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --line:#E2E6EA;
    --ink:#101828; --ink-soft:#475467; --ink-muted:#98A2B3;
    --accent:#0E7C66; --accent-soft:#E3F3EF; --accent-dark:#0A5E4D;
    --navy:#0B1B33;
    --ok:#12805A; --ok-soft:#E3F5EC;
    --warn:#8A4A05; --warn-soft:#FDF1E2;
    --bad:#B21F30; --bad-soft:#FBE7EA;
    --info:#1C5FA8; --info-soft:#E7F0FA;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --focus:0 0 0 3px rgba(14,124,102,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter","Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
    font-size:14.5px; -webkit-font-smoothing:antialiased;
  }
  /* Foco visible y consistente en todo lo interactivo (accesibilidad AA). */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible,
  .kcard:focus-visible, .card[data-action]:focus-visible{
    outline:none; box-shadow:var(--focus); border-radius:8px;
  }
  header{
    padding:16px 24px; border-bottom:1px solid var(--line);
    background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  header .logo{
    width:32px; height:32px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  header h1{margin:0; font-size:16px; font-weight:600; letter-spacing:-0.01em; color:#fff;}
  header p{margin:1px 0 0; color:#9AA7BD; font-size:12.5px;}
  header .estado-conexion{font-size:12px; color:#9AA7BD; white-space:nowrap; text-align:right;}
  nav{
    display:flex; gap:2px; padding:0 16px; background:var(--card);
    border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  nav button{
    border:none; background:none; padding:13px 15px; font-size:13.5px;
    font-weight:500; color:var(--ink-muted); cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease;
  }
  nav button:hover{color:var(--ink-soft);}
  nav button.active,nav button[aria-selected="true"]{color:var(--accent-dark); border-bottom-color:var(--accent);}
  main{padding:22px 24px 60px; max-width:1360px; margin:0 auto;}
  /* Transición suave al cambiar de pestaña. */
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  main.fade{animation:fadeIn .18s ease;}
  @media (prefers-reduced-motion:reduce){ main.fade{animation:none;} }
  .grid{display:grid; gap:14px;}
  .g5{grid-template-columns:repeat(5,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){ .g5,.g4,.g3,.g2{grid-template-columns:1fr 1fr;} }
  @media(max-width:480px){ .g5,.g4,.g3{grid-template-columns:1fr 1fr;} }
  .metric{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); transition:border-color .15s ease, box-shadow .15s ease;}
  .metric[data-action]{cursor:pointer;}
  .metric[data-action]:hover{border-color:var(--accent); box-shadow:0 2px 6px rgba(16,24,40,.10);}
  .metric .lbl{font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .metric .val{font-size:24px; font-weight:700; margin-top:6px; letter-spacing:-0.02em;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);}
  .card.banner-bad{border-color:var(--bad); background:var(--bad-soft);}
  .card h3{margin:0 0 4px; font-size:15px; font-weight:600;}
  .card .sub{color:var(--ink-soft); font-size:13px; margin-bottom:10px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .pill{
    display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:11.5px; font-weight:600;
  }
  .pill.lead{background:var(--info-soft); color:var(--info);}
  .pill.calificando{background:var(--warn-soft); color:var(--warn);}
  .pill.calificado{background:var(--accent-soft); color:var(--accent-dark);}
  .pill.visita_propuesta{background:#EEEDFE; color:#3C3489;}
  .pill.visita{background:#EEEDFE; color:#3C3489;}
  .pill.convertido{background:var(--ok-soft); color:var(--ok);}
  .pill.descartado{background:var(--bad-soft); color:var(--bad);}
  .pill.pendiente{background:var(--bad-soft); color:var(--bad);}
  .pill.parcial{background:var(--warn-soft); color:var(--warn);}
  .pill.cobrado{background:var(--ok-soft); color:var(--ok);}
  .pill.critica{background:var(--bad-soft); color:var(--bad);}
  .pill.alta{background:var(--warn-soft); color:var(--warn);}
  .pill.media{background:var(--info-soft); color:var(--info);}
  .pill.baja{background:var(--ok-soft); color:var(--ok);}
  .pill.confirmada{background:var(--ok-soft); color:var(--ok);}
  .pill.en_camino{background:var(--warn-soft); color:var(--warn);}
  .pill.realizada{background:var(--accent-soft); color:var(--accent-dark);}
  .pill.cancelada{background:var(--bad-soft); color:var(--bad);}
  .pill.reprogramada{background:var(--info-soft); color:var(--info);}
  .pill.simulado{background:#EEE4FB; color:#5B21B6;}
  .visita-row{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line);}
  .visita-row:last-child{border-bottom:none;}
  .visita-hora{font-size:15px; font-weight:700; min-width:56px; color:var(--ink);}
  .visita-info{flex:1; min-width:0;}
  .visita-info .nombre{font-weight:600; font-size:13.5px;}
  .visita-info .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .visita-acciones{display:flex; gap:6px; flex-wrap:wrap;}
  h3.seccion{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:28px 0 12px; color:var(--ink-soft);}
  h3.seccion:first-child{margin-top:8px;}
  h3.seccion.urgente{color:var(--bad);}
  .dcard.critica{border-left:4px solid var(--bad);}
  .dcard.alta{border-left:4px solid var(--warn);}
  .checklist{margin-top:8px;}
  .chk-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;}
  .chk-item span.done{text-decoration:line-through; color:var(--ink-muted);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .tabla-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  th{text-align:left; color:var(--ink-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:10px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--bg);}
  .opciones{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px;}
  @media(max-width:700px){ .opciones{grid-template-columns:1fr;} }
  .opcion{border:1px solid var(--line); border-radius:var(--radius); padding:14px; transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;}
  .opcion:hover{border-color:var(--accent); box-shadow:0 2px 6px rgba(16,24,40,.08);}
  .opcion.reco{border:2px solid var(--accent);}
  .opcion .tag{font-size:11px; font-weight:600; text-transform:uppercase; color:var(--ink-muted);}
  .opcion.reco .tag{color:var(--accent-dark);}
  .opcion .precio{font-size:20px; font-weight:700; margin:6px 0;}
  .opcion .desc{font-size:13px; color:var(--ink-soft); line-height:1.4;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line); background:var(--card); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink);
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px; line-height:1.2;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent-dark);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-dark); color:#fff; border-color:var(--accent-dark);}
  .btn.sm{padding:4px 9px; font-size:12px;}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--bg); color:var(--ink);}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{border:none; background:var(--card); padding:7px 13px; font-size:12.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:background .15s ease, color .15s ease;}
  .seg button:hover{background:var(--bg);}
  .seg button.active{background:var(--accent); color:#fff;}
  input,select,textarea{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; background:#fff; font-family:inherit; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:hover,select:hover,textarea:hover{border-color:var(--ink-muted);}
  label{color:var(--ink-soft);}
  .field-label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px; font-weight:500;}
  .empty{color:var(--ink-muted); font-size:13px; padding:20px 0; text-align:center;}
  .footnote{font-size:12px; color:var(--ink-muted); margin-top:6px;}
  .aviso{font-size:12px; color:var(--warn); background:var(--warn-soft); border-radius:8px; padding:6px 10px; margin-top:8px; display:inline-block;}
  .input-token{display:flex; gap:6px; align-items:stretch;}
  .input-token input{flex:1;}

  /* Kanban */
  .kanban{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; align-items:start;}
  @media(max-width:1100px){ .kanban{grid-template-columns:repeat(3,1fr);} }
  /* En celular real (~390px): scroll horizontal con columnas de ancho fijo,
     así Marco no pierde ninguna etapa del embudo. */
  @media(max-width:700px){
    .kanban{display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; scroll-snap-type:x proximity;}
    .kanban .kcol{flex:0 0 78vw; max-width:280px; scroll-snap-align:start;}
  }
  .kcol{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:80px;}
  .kcol h4{margin:2px 4px 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); display:flex; justify-content:space-between;}
  .kcard{background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:pointer; font-size:13px; transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;}
  .kcard:hover{border-color:var(--accent); box-shadow:0 2px 6px rgba(16,24,40,.08);}
  .kcard:active{transform:translateY(1px);}
  .kcard .nombre{font-weight:600; font-size:13px;}
  .kcard .diag{color:var(--ink-soft); font-size:11.5px; margin-top:3px;}
  .kcard .meta{display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:6px; flex-wrap:wrap;}

  /* Modal ficha */
  @keyframes modalIn{from{opacity:0;} to{opacity:1;}}
  @keyframes modalUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .modal-bg{position:fixed; inset:0; background:rgba(16,24,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; animation:modalIn .16s ease;}
  .modal{background:var(--card); border-radius:var(--radius); max-width:720px; width:100%; padding:26px 28px; box-shadow:0 20px 40px rgba(0,0,0,.2); animation:modalUp .18s ease;}
  @media (prefers-reduced-motion:reduce){ .modal-bg,.modal{animation:none;} }
  @media(max-width:520px){ .modal{padding:20px 18px;} .modal-bg{padding:20px 10px;} }
  .modal-close{float:right; cursor:pointer; color:var(--ink-muted); font-size:22px; line-height:1; background:none; border:none; padding:2px 6px;}
  .modal-close:hover{color:var(--ink);}
  .upsell-row{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .upsell-row:last-child{border-bottom:none;}
  .upsell-row .txt{flex:1;}
  .upsell-row .precio{font-weight:600; white-space:nowrap;}

  /* Orquestador */
  .orq-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:var(--card);}
  .orq-item .orden{width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
  .orq-item .info{flex:1; min-width:0;}
  .orq-item .hora{font-size:12px; color:var(--ink-muted);}
  .orq-item .mover{display:flex; flex-direction:column; gap:2px;}

  pre.prompt-box{white-space:pre-wrap; background:var(--bg); padding:14px; border-radius:9px; font-size:12.5px; max-height:360px; overflow:auto; border:1px solid var(--line); font-family:ui-monospace,Menlo,Consolas,monospace;}

  /* Calculadora */
  .esp-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line);}
  .esp-row:last-child{border-bottom:none;}
  .esp-row .esp-nom{flex:1; min-width:140px; font-size:13px;}
  .esp-row small{color:var(--ink-muted);}
  .calc-num{width:96px;}
  .res-metric{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media(max-width:600px){ .res-metric{grid-template-columns:1fr 1fr;} }
  .res-metric .rm{background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px;}
  .res-metric .rm .l{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.02em;}
  .res-metric .rm .v{font-size:18px; font-weight:700; margin-top:2px; letter-spacing:-0.01em;}
  .banner-info{border-color:var(--info); background:var(--info-soft);}

  /* Estados de carga (skeleton) */
  @keyframes shimmer{0%{background-position:-400px 0;} 100%{background-position:400px 0;}}
  .skeleton{background:linear-gradient(90deg,#eceff2 25%,#f6f8fa 50%,#eceff2 75%); background-size:800px 100%; animation:shimmer 1.2s infinite linear; border-radius:8px; color:transparent;}
  @media (prefers-reduced-motion:reduce){ .skeleton{animation:none;} }
  .sk-line{height:14px; margin:8px 0;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px;}
  .spinner.dark{border-color:rgba(16,24,40,.25); border-top-color:var(--accent);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Toasts / notificaciones (reemplazan a alert()) */
  #toast-root{position:fixed; right:16px; bottom:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:min(360px, calc(100vw - 32px));}
  .toast{background:var(--navy); color:#fff; padding:11px 14px; border-radius:9px; box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:13px; display:flex; gap:8px; align-items:flex-start; animation:modalUp .18s ease;}
  .toast .cerrar{margin-left:auto; cursor:pointer; opacity:.7;}
  .toast.ok{background:#0B5A45;}
  .toast.warn{background:#7A3E05;}
  .toast.bad{background:#8F1A29;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">⚡</div>
    <div>
      <h1>Electricista OS</h1>
      <p>Marco Florentino — Hurlingham, GBA Oeste</p>
    </div>
  </div>
  <div class="estado-conexion" id="header-estado" role="status" aria-live="polite"></div>
</header>

<nav id="nav" role="tablist" aria-label="Secciones"></nav>
<main id="main" role="tabpanel" tabindex="-1"></main>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="false"></div>

<script>
// ------------------------------------------------------------------
// CONEXIÓN A LA API REAL (FastAPI)
// Ajustá API_BASE al host donde corre tu backend. Lo normal es que
// Marco no toque nada: inicia sesión con usuario/contraseña en la
// pestaña "Conexión" (POST /auth/login) y el token queda guardado.
//
// NOTA DE SEGURIDAD (token en localStorage):
// El JWT se guarda en localStorage. Para una app de un solo usuario
// que corre local (Marco en su notebook/celular) es un trade-off
// aceptable: sobrevive al refresco y no hay que copiarlo a mano cada
// vez. La contra: cualquier script que llegue a ejecutarse en esta
// página podría leerlo (por eso este dashboard escapa TODO dato que
// venga del cliente/WhatsApp — ver escapeHtml más abajo). Si algún
// día esto se sirve a varios usuarios o en un dominio público,
// conviene pasar a una cookie httpOnly emitida por el backend.
// ------------------------------------------------------------------

let API_BASE = localStorage.getItem("eos_api_base") || "http://localhost:8000";
let API_TOKEN = localStorage.getItem("eos_api_token") || "";

let configuracion = { margen_insumos_default: 40, precio_visita_base: 35000, garantia_dias: 365 };
let prospectos = [];
let trabajos = [];
let gastosOperativos = [];
let insumos = [];
let visitas = [];
let usandoDatosDemo = false;
let sesionVencida = false;   // true cuando la API rechaza el token (401/403)
let cargando = false;        // true mientras cargarDatos() está en vuelo

async function apiFetch(path, options={}){
  const resp = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(API_TOKEN ? {"Authorization": "Bearer " + API_TOKEN} : {}),
      ...(options.headers||{})
    }
  });
  if(!resp.ok){
    const texto = await resp.text().catch(()=> "");
    const err = new Error(`${resp.status} ${resp.statusText} — ${texto.slice(0,200)}`);
    err.status = resp.status;      // clave para distinguir auth (401/403) de otros errores
    throw err;
  }
  // 204 No Content, etc.
  const ct = resp.headers.get("content-type") || "";
  if(!ct.includes("application/json")) return {};
  return resp.json();
}

// ------------------------------------------------------------------
// ESCAPE HTML — todo dato que venga del cliente (nombre, teléfono,
// notas, diagnóstico, texto de mensajes de WhatsApp que llegan por
// /prospectos/procesar) pasa por acá ANTES de inyectarse en el DOM.
// El texto del cliente llega crudo desde WhatsApp y lo guarda una IA:
// sin escapar, un mensaje con <script>/HTML se ejecutaría en el
// navegador de Marco (XSS). esc() sirve tanto para contenido de texto
// como para valores de atributos (escapa comillas simples y dobles).
// ------------------------------------------------------------------
function esc(s){
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Datos de respaldo — se usan SOLO si la API no responde (error de
// RED, no de credenciales), para que el dashboard no quede en blanco
// mientras Marco no tiene el servidor corriendo.
function datosDemo(){
  configuracion = { margen_insumos_default: 40, precio_visita_base: 35000, garantia_dias: 365 };
  prospectos = [
    {id:1, nombre:"Laura Gimenez", telefono:"11-3344-XXXX", estado:"CALIFICADO", riesgo_tablero_detectado:true, presupuesto_estimado_rango:"120000-250000", proximo_recordatorio:"18/08"},
    {id:2, nombre:"Diego Martinez", telefono:"11-5566-XXXX", estado:"VISITA_PROPUESTA", riesgo_tablero_detectado:false, presupuesto_estimado_rango:"35000-60000", proximo_recordatorio:"16/08"},
  ];
  trabajos = [
    {id:101, cliente:"Laura Gimenez", tipo:"Tablero seguro (Opción C)", monto_total:245000, estado_pago:"PENDIENTE", monto_cobrado:0, cae:null, insumos:[{nombre:"Térmica Schneider 25A", cant:3, costo:8500}]},
  ];
  gastosOperativos = [{categoria:"COMBUSTIBLE", monto:42000}];
  insumos = [{nombre:"Térmica Schneider 25A", proveedor:"Casa Eléctrica Once", costo:8500, stock:12, stock_min:5}];
  visitas = [
    {id:"v1", cliente:"Laura Gimenez", telefono:"11-3344-XXXX", trabajo_tipo:"Tablero seguro (Opción C)", fecha_hora:new Date(Date.now()+3600e3).toISOString(), duracion_min:60, zona:"ZONA_1", estado:"CONFIRMADA", notas:"Revisión final", link_maps:null},

// Adapta la forma que devuelve tu API (SQLAlchemy -> JSON) a lo que
// espera el render. Ajustá los nombres de campo si tu serializer
// devuelve otros nombres (ej: snake_case vs camelCase).
async function cargarDatos(){
  cargando = true;
  actualizarHeaderEstado();
  try{
    const [emp, pros, trab, gastos, ins, agen] = await Promise.all([
      apiFetch("/empresa/configuracion"),
      apiFetch("/prospectos"),
      apiFetch("/trabajos"),
      apiFetch("/gastos-operativos"),
      apiFetch("/insumos"),
      apiFetch("/agenda"),
    ]);
    configuracion = emp;
    prospectos = pros;
    trabajos = trab.map(t => ({
      ...t,
      insumos: (t.insumos_usados||[]).map(i => ({
        nombre: i.insumo?.nombre || i.nombre,
        cant: i.cantidad,
        costo: Number(i.costo_unitario_historico)
      }))
    }));
    gastosOperativos = gastos;
    insumos = ins;
    visitas = agen;
    usandoDatosDemo = false;
    sesionVencida = false;
  }catch(e){
    if(e && (e.status === 401 || e.status === 403)){
      // La API respondió, pero rechazó el token. NO caemos a datos
      // demo en silencio: es un problema de sesión, no de red. Puede
      // pasar si el SECRET_KEY del backend rotó (README: es aleatorio
      // cuando no está seteado en el entorno) y el JWT viejo dejó de
      // valer. Mostramos un aviso claro y pedimos re-login.
      sesionVencida = true;
      console.warn("La API rechazó el token (" + e.status + "):", e.message);
    }else{
      // Error de red / servidor apagado -> datos de ejemplo.
      console.warn("No se pudo conectar a la API, usando datos de ejemplo:", e.message);
      datosDemo();
    }
  }finally{
    cargando = false;
    actualizarHeaderEstado();
  }
}

const fmt = n => "$" + Math.round(Number(n)||0).toLocaleString("es-AR");

function calcularRentabilidad(trabajo){
  const costoMateriales = (trabajo.insumos||[]).reduce((s,i)=> s + i.cant*i.costo, 0);
  const gananciaNeta = trabajo.monto_total - costoMateriales;
  const margen = trabajo.monto_total > 0 ? (gananciaNeta/trabajo.monto_total*100) : 0;
  return {costoMateriales, gananciaNeta, margen};
}

function precioVenta(costo, margenPersonalizado){
  const margen = margenPersonalizado ?? configuracion.margen_insumos_default;
  return costo * (1 + margen/100);
}

function reporteMensual(){
  const ingresos = trabajos.filter(t=>t.estado_pago==="COBRADO").reduce((s,t)=>s+t.monto_total,0);
  const costoMateriales = trabajos.filter(t=>t.estado_pago==="COBRADO")
    .reduce((s,t)=> s + (t.insumos||[]).reduce((x,i)=>x+i.cant*i.costo,0), 0);
  const gastos = gastosOperativos.reduce((s,g)=>s+g.monto,0);
  return {ingresos, costoMateriales, gastos, neta: ingresos - costoMateriales - gastos};
}

// NOTIFICACIONES (toast) — reemplazan a alert() y unifican el manejo
// de errores/avisos con el resto del diseño.

function toast(mensaje, tipo="info", ms=4200){
  const root = document.getElementById("toast-root");
  if(!root) return;
  const el = document.createElement("div");
  el.className = "toast " + (tipo || "");
  el.setAttribute("role", tipo === "bad" ? "alert" : "status");
  el.innerHTML = `<span>${esc(mensaje)}</span><span class="cerrar" data-action="cerrar-toast" aria-hidden="true">✕</span>`;
  root.appendChild(el);
  const quitar = ()=>{ el.style.opacity="0"; el.style.transition="opacity .2s"; setTimeout(()=>el.remove(), 200); };
  el.querySelector(".cerrar").addEventListener("click", quitar);
  if(ms) setTimeout(quitar, ms);
}

function normalizar(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function upsellsSugeridos(diagnostico){
  if(!diagnostico) return [];
  const texto = normalizar(
    (diagnostico.problema_nombre||"") + " " +
    (diagnostico.causas_posibles||[]).map(c=>c.descripcion).join(" ")
  );
  const matches = CATALOGO_UPSELLS.filter(cat =>
    cat.keywords.some(k => texto.includes(normalizar(k)))
  );
  const usados = matches.length ? matches : [];
  const vistos = new Set();
  const resultado = [];
  usados.forEach(cat=>{
    cat.upsells.forEach(u=>{
      if(!vistos.has(cat.id+u.texto)){
        vistos.add(cat.id+u.texto);
        resultado.push({categoria:cat.nombre, texto:u.texto, precio_ref:cat.precio_ref});
      }
    });
  });
  return resultado;
}

// MODAL: manejo de foco (foco inicial + trap de Tab + Escape)
// ------------------------------------------------------------------
let _ultimoFocoAntesModal = null;

function _focusablesModal(modal){
  return Array.from(modal.querySelectorAll(
    'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null);
}

function activarModal(moverFoco){
  const modal = document.querySelector("#modal-root .modal");
  if(!modal) return;
  if(moverFoco){
    _ultimoFocoAntesModal = document.activeElement;
    const f = _focusablesModal(modal);
    (f[0] || modal).focus();
  }
  modal.onkeydown = (e)=>{
    if(e.key !== "Tab") return;
    const f = _focusablesModal(modal);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
}

const ORQ_KEY = "eos_orquestador_orden";
function getOrdenManual(){
  try{ return JSON.parse(localStorage.getItem(ORQ_KEY) || "[]"); }catch(e){ return []; }
}
function setOrdenManual(ids){ localStorage.setItem(ORQ_KEY, JSON.stringify(ids)); }

function ordenDelDia(items){
  const manual = getOrdenManual();
  const porUrgencia = [...items].sort((a,b)=> (ORDEN_URGENCIA[urgenciaDe(b)]||0) - (ORDEN_URGENCIA[urgenciaDe(a)]||0));
  if(!manual.length) return porUrgencia;
  const porId = Object.fromEntries(porUrgencia.map(p=>[String(p.id), p]));
  const ordenados = manual.map(id=>porId[String(id)]).filter(Boolean);
  const faltantes = porUrgencia.filter(p=>!manual.includes(String(p.id)));
  return [...ordenados, ...faltantes];
}

function moverOrquestador(idx, dir){
  const items = ordenDelDia(prospectosParaOrquestador());
  const nuevoIdx = idx + dir;
  if(nuevoIdx < 0 || nuevoIdx >= items.length) return;
  [items[idx], items[nuevoIdx]] = [items[nuevoIdx], items[idx]];
  setOrdenManual(items.map(p=>String(p.id)));
  render(currentTab);
}

function prospectosParaOrquestador(){
  const activos = prospectos.filter(p=>!["CONVERTIDO","DESCARTADO"].includes(p.estado));
  return activos.filter(p=> ["CRITICA","ALTA"].includes(urgenciaDe(p)) || esHoy(p.proximo_recordatorio));
}

function renderOrquestador(){
  const items = ordenDelDia(prospectosParaOrquestador());
  if(!items.length) return `<div class="empty">Sin urgencias ni turnos para hoy — nada que ordenar.</div>`;
  let horaCursor = 9*60;
  return items.map((p, idx)=>{
    const hh = String(Math.floor(horaCursor/60)).padStart(2,"0");
    const mm = String(horaCursor%60).padStart(2,"0");
    horaCursor += 60;
    const u = urgenciaDe(p);
    return `
    <div class="orq-item">
      <div class="orden">${idx+1}</div>
      <div class="info">
        <div style="font-weight:600;">${esc(p.nombre || "Sin nombre")} <span class="pill ${pillClass(u)}" style="margin-left:4px;">${iconoUrgencia(u)} ${esc(u)}</span></div>
        <div class="hora">🕐 ~${hh}:${mm} estimado · traslado simulado (maps_service en modo real: Tanda 8)</div>
      </div>
      <div class="mover">
        <button class="btn sm ghost" data-action="mover-orquestador" data-idx="${idx}" data-dir="-1" ${idx===0?"disabled":""} aria-label="Subir">▲</button>
        <button class="btn sm ghost" data-action="mover-orquestador" data-idx="${idx}" data-dir="1" ${idx===items.length-1?"disabled":""} aria-label="Bajar">▼</button>
      </div>
    </div>`;
  }).join("");
}

function irATab(tabId){ render(tabId); }

let agendaFechaSeleccionada = null; // null = "todas las próximas"

function fmtHora(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtFechaCorta(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR", {weekday:"short", day:"2-digit", month:"2-digit"});
}
function estadoVisitaClass(e){ return pillClass(e); }

function whatsappLink(telefono, texto){
  const tel = String(telefono||"").replace(/[^\d]/g,"");
  return `https://wa.me/${tel}?text=${encodeURIComponent(texto||"")}`;
}

function visitaRow(v){
  const texto = `Hola ${v.cliente}, te confirmo la visita para el ${fmtFechaCorta(v.fecha_hora)} a las ${fmtHora(v.fecha_hora)}.`;
  const telDigits = String(v.telefono||"").replace(/[^\d+]/g,"");
  const sid = esc(v.id);
  return `
  <div class="visita-row">
    <div class="visita-hora">${esc(fmtHora(v.fecha_hora))}</div>
    <div class="visita-info">
      <div class="nombre">${esc(v.cliente)} <span class="pill ${estadoVisitaClass(v.estado)}" style="margin-left:6px;">${esc(v.estado)}</span></div>
      <div class="sub">${esc(v.trabajo_tipo || "Sin trabajo asociado")} ${v.zona ? "· " + esc(v.zona) : ""} ${v.telefono ? "· " + esc(v.telefono) : ""}</div>
      ${v.notas ? `<div class="sub">📝 ${esc(v.notas)}</div>` : ""}
    </div>
    <div class="visita-acciones">
      ${v.telefono ? `<a class="btn sm" href="${esc(whatsappLink(v.telefono, texto))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
      ${v.telefono ? `<a class="btn sm" href="tel:${esc(telDigits)}">Llamar</a>` : ""}
      ${v.link_maps ? `<a class="btn sm" href="${esc(v.link_maps)}" target="_blank" rel="noopener">Maps</a>` : ""}
      ${!["REALIZADA","CANCELADA"].includes(v.estado) ? `
        <button class="btn sm" data-action="cambiar-estado-visita" data-id="${sid}" data-estado="CONFIRMADA" ${v.estado==="CONFIRMADA"?"disabled":""}>Confirmar</button>
        <button class="btn sm" data-action="cambiar-estado-visita" data-id="${sid}" data-estado="REALIZADA">Realizada</button>

}

async function cambiarEstadoVisita(id, estado){
  try{
    await apiFetch(`/agenda/${id}/estado`, {method:"PATCH", body: JSON.stringify({estado})});
    await cargarDatos();
    render(currentTab);
    toast("Visita actualizada a " + estado.toLowerCase() + ".", "ok");
  }catch(e){
    toast("No se pudo actualizar la visita: " + e.message, "bad");
  }
}

function renderAgenda(){
  const filtradas = agendaFechaSeleccionada
    ? visitas.filter(v => v.fecha_hora.slice(0,10) === agendaFechaSeleccionada)
    : visitas.filter(v => !["CANCELADA","REALIZADA"].includes(v.estado));
  const ordenadas = [...filtradas].sort((a,b)=> new Date(a.fecha_hora) - new Date(b.fecha_hora));

  const hoyStr = new Date().toISOString().slice(0,10);
  const opcionesFecha = [
    {v:"", label:"Próximas (todas)"},
    {v:hoyStr, label:"Hoy"},
    {v:new Date(Date.now()+86400e3).toISOString().slice(0,10), label:"Mañana"},
  ];

  if(usandoDatosDemo){
    return `<div class="card"><div class="sub">Sin conexión a la API — conectate en la pestaña "Conexión" para ver la agenda real.</div></div>`;
  }

  return `
  <div class="toolbar">
    <div class="seg">
      ${opcionesFecha.map(o=>`<button class="${agendaFechaSeleccionada===o.v || (o.v==="" && !agendaFechaSeleccionada) ? 'active':''}" data-action="agenda-set-fecha" data-value="${esc(o.v)}">${esc(o.label)}</button>`).join("")}
      <input type="date" value="${esc(agendaFechaSeleccionada||'')}" data-change="agenda-fecha-input" style="border:none; padding:7px 10px; font-size:12.5px;" aria-label="Elegir fecha">
    </div>
    <button class="btn primary" data-action="abrir-modal-nueva-visita">+ Agendar visita</button>
  </div>
  <div class="card">
    ${ordenadas.length ? ordenadas.map(visitaRow).join("") : '<div class="empty">No hay visitas agendadas para este filtro.</div>'}
  </div>
  `;
}

function abrirModalNuevaVisita(){
  const root = document.getElementById("modal-root");
  // Clientes reales: unimos prospectos (que tienen id + nombre) con los
  // clientes que ya aparecen en trabajos. El <select> guarda el id como
  // value; si el cliente todavía no está cargado, "Otro" habilita un
  // campo para escribir el id a mano (arregla el bug de cliente_id manual).
  const porId = new Map();
  prospectos.forEach(p=>{ if(p && p.id!=null) porId.set(String(p.id), p.nombre || ("#"+p.id)); });
  trabajos.forEach(t=>{ if(t && t.cliente_id!=null && !porId.has(String(t.cliente_id))) porId.set(String(t.cliente_id), t.cliente || ("#"+t.cliente_id)); });
  const clientes = [...porId.entries()].sort((a,b)=> String(a[1]).localeCompare(String(b[1]), "es"));

  const trabajosOpts = trabajos
    .filter(t=> t && t.id!=null)
    .map(t=> `<option value="${esc(t.id)}">${esc((t.cliente? t.cliente+" — ":"") + (t.tipo||("#"+t.id)))}</option>`)
    .join("");

  root.innerHTML = `
  <div class="modal-bg" data-action="cerrar-modal">
    <div class="modal" data-action="stop" style="max-width:480px;" role="dialog" aria-modal="true" aria-label="Agendar visita">
      <button class="modal-close" data-action="cerrar-modal" aria-label="Cerrar">✕</button>
      <h3 style="margin-top:0;">Agendar visita</h3>
      <div class="sub">Elegí el cliente de la lista. Si todavía no está cargado, usá "Otro" e ingresá el ID a mano.</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">
        <div>
          <label class="field-label" for="nv-cliente-sel">Cliente</label>
          <select id="nv-cliente-sel" style="width:100%;" data-change="nv-cliente-sel">
            ${clientes.length ? clientes.map(([id,nombre])=>`<option value="${esc(id)}">${esc(nombre)}</option>`).join("") : ""}
            <option value="__otro__">Otro (ingresar ID a mano)…</option>
          </select>
        </div>
        <div id="nv-cliente-manual-wrap" ${clientes.length ? 'hidden' : ''}>
          <label class="field-label" for="nv-cliente">ID de Cliente</label>
          <input id="nv-cliente" style="width:100%;" placeholder="cliente_id">
        </div>
        <div>
          <label class="field-label" for="nv-trabajo">Trabajo (opcional)</label>
          <select id="nv-trabajo" style="width:100%;">
            <option value="">— Sin trabajo asociado —</option>
            ${trabajosOpts}
          </select>
        </div>
        <div>
          <label class="field-label" for="nv-fecha">Fecha y hora</label>
          <input id="nv-fecha" type="datetime-local" style="width:100%;">
        </div>
        <div>
          <label class="field-label" for="nv-duracion">Duración (min)</label>
          <input id="nv-duracion" type="number" value="60" style="width:100%;">
        </div>
        <div>
          <label class="field-label" for="nv-zona">Zona</label>
          <input id="nv-zona" style="width:100%;" placeholder="ZONA_1">
        </div>
        <div>
          <label class="field-label" for="nv-notas">Notas</label>
          <textarea id="nv-notas" rows="2" style="width:100%;"></textarea>
        </div>
      </div>
      <div class="row" style="margin-top:18px;">
        <button class="btn" data-action="cerrar-modal">Cancelar</button>
        <button class="btn primary" data-action="guardar-nueva-visita">Agendar</button>
      </div>
      <div id="nv-error" class="footnote" style="color:var(--bad); margin-top:8px;" role="alert"></div>
    </div>
  </div>`;
  // Si no hay clientes cargados, arrancamos directo en modo manual.
  if(!clientes.length){
    const sel = document.getElementById("nv-cliente-sel");
    if(sel) sel.value = "__otro__";
  }
  activarModal(true);
}

// Muestra/oculta el campo de ID manual según la opción "Otro".
function nvClienteSelChange(){
  const sel = document.getElementById("nv-cliente-sel");
  const wrap = document.getElementById("nv-cliente-manual-wrap");
  if(!sel || !wrap) return;
  const manual = sel.value === "__otro__";
  wrap.hidden = !manual;
  if(manual){ const inp = document.getElementById("nv-cliente"); if(inp) inp.focus(); }
}

async function guardarNuevaVisita(){
  const sel = document.getElementById("nv-cliente-sel");
  let cliente_id = "";
  if(sel && sel.value && sel.value !== "__otro__"){
    cliente_id = sel.value;
  }else{
    const manual = document.getElementById("nv-cliente");
    cliente_id = manual ? manual.value.trim() : "";
  }
  const trabajoSel = document.getElementById("nv-trabajo");
  const trabajo_id = (trabajoSel && trabajoSel.value.trim()) || null;
  const fechaLocal = document.getElementById("nv-fecha").value;
  const duracion_min = Number(document.getElementById("nv-duracion").value) || 60;
  const zona = document.getElementById("nv-zona").value.trim() || null;
  const notas = document.getElementById("nv-notas").value.trim() || null;
  const errBox = document.getElementById("nv-error");

  if(!cliente_id || !fechaLocal){
    errBox.textContent = "Falta elegir cliente o cargar fecha/hora.";
    return;
  }
  try{
    await apiFetch("/agenda", {
      method: "POST",
      body: JSON.stringify({
        cliente_id, trabajo_id,
        fecha_hora: new Date(fechaLocal).toISOString(),
        duracion_min, zona, notas,
      }),
    });
    cerrarModal();
    await cargarDatos();
    render("agenda");
    toast("Visita agendada.", "ok");
  }catch(e){
    errBox.textContent = e.message;
  }
}

// Login real: intenta primero el formato estándar de FastAPI
// (OAuth2PasswordRequestForm -> x-www-form-urlencoded) y, si el
// backend responde 415/422, reintenta como JSON. Lee el token de
// access_token / token / access. Ajustá si tu /auth/login difiere.
async function login(){
  const user = (document.getElementById("login-user")||{}).value?.trim() || "";
  const pass = (document.getElementById("login-pass")||{}).value || "";
  const errBox = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  if(errBox) errBox.textContent = "";
  if(!user || !pass){ if(errBox) errBox.textContent = "Ingresá usuario y contraseña."; return; }
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Ingresando…'; }

  const leerToken = d => d && (d.access_token || d.token || d.access || d.jwt);
  const intento = async (body, headers)=>{
    const resp = await fetch(API_BASE + "/auth/login", {method:"POST", headers, body});
    if(!resp.ok){ const e = new Error(await resp.text().catch(()=> resp.statusText)); e.status = resp.status; throw e; }
    return resp.json().catch(()=> ({}));
  };

  try{
    let data;
    try{
      const form = new URLSearchParams({username:user, password:pass});
      data = await intento(form.toString(), {"Content-Type":"application/x-www-form-urlencoded"});
    }catch(e1){
      if(e1.status === 415 || e1.status === 422 || e1.status === 400){
        data = await intento(JSON.stringify({username:user, password:pass}), {"Content-Type":"application/json"});
      }else{ throw e1; }
    }
    const token = leerToken(data);
    if(!token) throw new Error("El servidor no devolvió un token reconocible (esperaba access_token).");
    API_TOKEN = token;
    localStorage.setItem("eos_api_token", API_TOKEN);
    sesionVencida = false;
    await cargarDatos();
    render("dashboard");
    toast("Sesión iniciada.", "ok");
  }catch(e){
    if(e.status === 401 || e.status === 403){
      if(errBox) errBox.textContent = "Usuario o contraseña incorrectos.";
    }else if(e.status){
      if(errBox) errBox.textContent = "Error del servidor (" + e.status + "). Revisá la URL de la API en Configuración avanzada.";
    }else{
      if(errBox) errBox.textContent = "No se pudo conectar al servidor. ¿Está corriendo y la URL es correcta?";
    }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Ingresar"; }
  }
}

async function facturar(id){
  const t = trabajos.find(x=>String(x.id)===String(id));
  if(!t) return;
  // Facturar emite un comprobante fiscal: es una acción deliberada, por
  // eso se confirma antes (a diferencia de los errores, que van por toast).
  if(!confirm(`¿Emitir factura para "${t.cliente}" por ${fmt(t.monto_total)}?`)) return;

  if(usandoDatosDemo || sesionVencida){
    t.cae = "SIMULADO" + Math.floor(Math.random()*100000);
    render("trabajos");
    toast("Facturación SIMULADA (sin backend conectado).", "warn");
    return;
  }
  try{
    // Endpoint real de facturación. Si el backend todavía no lo expone,
    // caemos a una simulación CLARAMENTE marcada (pill SIMULADO).
    const r = await apiFetch(`/trabajos/${id}/facturar`, {method:"POST"});
    t.cae = r.cae || r.CAE || r.numero || ("SIMULADO" + Math.floor(Math.random()*100000));
    if(r.pdf_url) t.pdf_url = r.pdf_url;
    render("trabajos");
    toast("Factura emitida" + (String(t.cae).startsWith("SIMULADO") ? " (simulada)" : " — CAE " + t.cae) + ".", "ok");
  }catch(e){
    t.cae = "SIMULADO" + Math.floor(Math.random()*100000);
    render("trabajos");
    toast("Facturación SIMULADA — el endpoint real no está disponible todavía (" + (e.status || "sin respuesta") + ").", "warn");
  }
}

  const box = document.getElementById(contenedorId);
  if(!box) return;
  const id = contenedorId + "-txt";
  const pre = document.createElement("pre");
  pre.className = "prompt-box";
  pre.id = id;
  pre.textContent = texto;
  const btn = document.createElement("button");
  btn.className = "btn sm";
  btn.style.marginTop = "6px";
  btn.dataset.action = "copiar-texto";
  btn.dataset.target = id;
  btn.textContent = "Copiar prompt";
  box.innerHTML = "";
  box.appendChild(pre);
  box.appendChild(btn);
}

// CALCULADORA DE CABLES Y MATERIALES — orientativa según AEA 90364.
// Todo el cálculo es client-side (no toca el backend). Da secciones,
// protecciones y una lista de materiales + presupuesto para cotizar
// rápido. NO reemplaza el proyecto eléctrico del matriculado: son
// valores de referencia que Marco valida con las tablas oficiales.
//
// Fuentes de las constantes (aproximadas, método típico domiciliario):
// - Corriente admisible por sección (cobre, PVC) — tablas AEA 90364-7-771.
// - Factores de corrección por temperatura y por agrupamiento (IEC/AEA).
// - Secciones y protecciones mínimas por tipo de circuito (IUG/TUG/…).
// - Caída de tensión admisible: 3% iluminación, 5% otros usos.
// ------------------------------------------------------------------
const SECCIONES = [1.5, 2.5, 4, 6, 10, 16, 25, 35];
// Corriente admisible (A) por sección y método de instalación.
const AMPACIDAD = {
  embutido:   {1.5:15,   2.5:21, 4:28, 6:36, 10:50, 16:66, 25:84,  35:104},
  cablecanal: {1.5:17.5, 2.5:24, 4:32, 6:41, 10:57, 16:76, 25:101, 35:125},
  aire:       {1.5:19.5, 2.5:27, 4:36, 6:46, 10:63, 16:85, 25:112, 35:138},
  subterraneo:{1.5:22,   2.5:29, 4:38, 6:47, 10:63, 16:81, 25:104, 35:125},
};
const F_TEMP  = {25:1.03, 30:1.0, 35:0.94, 40:0.87, 45:0.79};
const F_AGRUP = {1:1.0, 2:0.80, 3:0.70, 4:0.65, 5:0.60, 6:0.57, 7:0.54};
const BREAKERS = [6, 10, 16, 20, 25, 32, 40, 50, 63];
const RHO = 0.0179; // resistividad cobre (Ω·mm²/m) aprox. (conductividad ~56)

const TIPOS_CIRCUITO = {
  IUG: {label:"Iluminación (IUG)",        sMin:1.5, inMax:16, cosphi:1.0, caidaMax:3},
  TUG: {label:"Tomas uso general (TUG)",  sMin:2.5, inMax:20, cosphi:0.9, caidaMax:5},
  IUE: {label:"Iluminación especial (IUE)",sMin:2.5, inMax:16, cosphi:1.0, caidaMax:3},
  TUE: {label:"Tomas uso especial (TUE)", sMin:2.5, inMax:25, cosphi:0.9, caidaMax:5},
  ACU: {label:"Carga especial (ACU)",     sMin:2.5, inMax:63, cosphi:0.9, caidaMax:5},
};

const PRECIOS_DEFAULT = {
  "cable_1.5":950, "cable_2.5":1450, "cable_4":2300, "cable_6":3300, "cable_10":5400, "cable_16":8200,
  "termica_10":8000, "termica_16":8500, "termica_20":9200, "termica_25":11000, "termica_32":13500, "termica_40":16000,
  "diferencial_30ma":46000,
  "caja_embutir":1300, "modulo_toma":3800, "modulo_llave":3400, "tapa_bastidor":2600,
  "cano_corrugado":750, "tablero_modulo":3500, "jabalina_pat":26000,
  "mano_obra_boca":18000, "mano_obra_hora":12000, "visita_diagnostico":54310,
};

const fmtSec = s => String(s).replace(".", ",") + " mm²";
const valId  = id => { const e = document.getElementById(id); return e ? e.value : ""; };

let ultimoCalculo = null; // {circuitos, contexto, materiales, presupuesto, grado, meta}

// Núcleo: dimensiona UN circuito. Devuelve sección, térmica, diferencial,
// caída de tensión y alertas de norma.
function dimensionarCircuito({nombre, tipo, P=null, I=null, V=230, L=10, metodo="embutido", nAgrup=1, tempC=30}){
  const t = TIPOS_CIRCUITO[tipo] || TIPOS_CIRCUITO.ACU;
  const cosphi = t.cosphi;
  let Ib = I != null ? I : (P != null ? P / (V * cosphi) : 0);
  if(!(Ib > 0)) Ib = 0.1;
  const ft = F_TEMP[tempC] ?? 1.0;
  const fa = F_AGRUP[Math.min(Math.max(nAgrup,1), 7)] ?? 0.54;
  const amp = AMPACIDAD[metodo] || AMPACIDAD.embutido;
  const alertas = [];

  // 1) Sección por corriente admisible corregida.
  let sAmp = SECCIONES.find(s => amp[s] * ft * fa >= Ib);
  if(sAmp == null){ sAmp = 35; alertas.push("La corriente supera lo que cubre la tabla — verificá con un cálculo específico o subí de sección."); }
  // 2) Sección mínima reglamentaria por tipo de circuito.
  const sMin = t.sMin;
  // 3) Sección por caída de tensión (monofásico).
  const caidaEn = s => (2 * RHO * L * Ib * cosphi / s) / V * 100;
  let sDv = SECCIONES.find(s => caidaEn(s) <= t.caidaMax) || 35;

  let seccion = SECCIONES.find(s => s >= Math.max(sAmp, sMin, sDv)) || 35;

  // 4) Térmica: menor estándar que cumpla Ib ≤ In ≤ Iz_corregida y ≤ máx del tipo.
  let termica = null;
  for(const s of SECCIONES){
    if(s < seccion) continue;
    const iz = amp[s] * ft * fa;
    const b = BREAKERS.find(x => x >= Ib && x <= iz && x <= t.inMax);
    if(b){ seccion = s; termica = b; break; }
  }
  if(!termica){ termica = BREAKERS.find(b => b >= Ib) || 63; alertas.push("Revisá la coordinación protección/conductor (In > corriente admisible)."); }

  const caidaPct = caidaEn(seccion);
  if(caidaEn(sMin) > t.caidaMax && seccion > sMin) alertas.push(`Sección elevada por longitud (${L} m): la caída de tensión exigía más cobre.`);

  return {nombre: nombre || t.label, tipo, Ib, seccion, termica, diferencial:"30 mA", caidaPct, L, alertas};
}

function gradoElectrificacion(m2){
  if(m2 <= 60)  return {grado:"Mínimo",   minCirc:2, nDif:1};
  if(m2 <= 130) return {grado:"Medio",    minCirc:3, nDif:1};
  if(m2 <= 200) return {grado:"Elevado",  minCirc:5, nDif:2};
  return {grado:"Superior", minCirc:6, nDif:2};
}

function precioTermica(precios, In){
  const keys = [10, 16, 20, 25, 32, 40];
  const k = keys.includes(In) ? In : keys.reduce((a,b)=> Math.abs(b-In) < Math.abs(a-In) ? b : a, 10);
  return Number(precios["termica_" + k] || 0);
}

// Arma la lista de materiales a partir de los circuitos dimensionados.
function construirMateriales(circuitos, contexto, precios){
  const {bocasIlum=0, bocasToma=0, nDif=1, incluyePAT=true, soloCircuito=false} = contexto;
  const items = [];
  const waste = 1.10;
  const push = (item, cant, unidad, key) => {
    if(cant <= 0) return;
    const pu = Number(precios[key] || 0);
    const c = Math.round(cant * 100) / 100;
    items.push({item, cant:c, unidad, precio:pu, subtotal: pu * cant, key});
  };

  // Cable por sección: fase + neutro + tierra, cada uno = suma de largos.
  const porSeccion = {};
  circuitos.forEach(c => { porSeccion[c.seccion] = (porSeccion[c.seccion] || 0) + c.L; });
  Object.keys(porSeccion).sort((a,b)=> a-b).forEach(s => {
    const m = porSeccion[s] * waste;
    push(`Cable ${fmtSec(s)} — Fase (castaño)`,        m, "m", `cable_${s}`);
    push(`Cable ${fmtSec(s)} — Neutro (celeste)`,       m, "m", `cable_${s}`);
    push(`Cable ${fmtSec(s)} — Tierra (verde/amarillo)`, m, "m", `cable_${s}`);
  });

  // Térmicas por amperaje.
  const porTermica = {};
  circuitos.forEach(c => { porTermica[c.termica] = (porTermica[c.termica] || 0) + 1; });
  Object.keys(porTermica).sort((a,b)=> a-b).forEach(In => {
    const cant = porTermica[In];
    const pu = precioTermica(precios, Number(In));
    items.push({item:`Termomagnética ${In} A`, cant, unidad:"u", precio:pu, subtotal: pu*cant, key:"termica_"+In});
  });

  push(`Interruptor diferencial 30 mA`, nDif, "u", "diferencial_30ma");

  if(!soloCircuito){
    push(`Caja de embutir`,            bocasIlum + bocasToma, "u", "caja_embutir");
    push(`Módulo tomacorriente`,       bocasToma,             "u", "modulo_toma");
    push(`Módulo llave/interruptor`,   bocasIlum,             "u", "modulo_llave");
    push(`Tapa + bastidor`,            bocasIlum + bocasToma, "u", "tapa_bastidor");
  }

  const largoTotal = circuitos.reduce((s,c)=> s + c.L, 0);
  push(`Caño corrugado`, Math.ceil(soloCircuito ? largoTotal : largoTotal * 0.6), "m", "cano_corrugado");

  if(!soloCircuito){
    const modulos = 2 /*main bipolar*/ + nDif * 2 + circuitos.length;
    const conReserva = Math.ceil(modulos * 1.25);
    const tam = [8, 12, 18, 24, 36].find(t => t >= conReserva) || 36;
    push(`Tablero ${tam} módulos (aprox.)`, tam, "módulo", "tablero_modulo");
    if(incluyePAT) push(`Puesta a tierra (jabalina + tomacable)`, 1, "u", "jabalina_pat");
  }

  return items;
}

function presupuestar(items, opts, precios){
  const {bocas=0, margen, manoObra="boca", horas=0, incluyeVisita=true} = opts;
  const materiales = items.reduce((s,i)=> s + i.subtotal, 0);
  const m = margen ?? configuracion.margen_insumos_default;
  const materialesConMargen = materiales * (1 + m/100);
  const mo = manoObra === "boca"
    ? bocas * Number(precios.mano_obra_boca || 0)
    : horas * Number(precios.mano_obra_hora || 0);
  const visita = incluyeVisita ? Number(precios.visita_diagnostico || 0) : 0;
  return {materiales, materialesConMargen, mo, visita, total: materialesConMargen + mo + visita, margen:m};
}

function calcularRapido(){
  const tipo = valId("cr-tipo") || "TUG";
  const modoEntrada = valId("cr-modo-entrada") || "P";
  const P = modoEntrada === "P" ? numId("cr-potencia") : null;
  const I = modoEntrada === "I" ? numId("cr-corriente") : null;
  const L = numId("cr-longitud") || 10;
  const metodo = valId("cr-metodo") || "embutido";
  const agrup = numId("cr-agrup") || 1;
  const temp = numId("cr-temp") || 30;
  const c = dimensionarCircuito({tipo, P, I, L, metodo, nAgrup:agrup, tempC:temp});
  const precios = getPrecios();
  const materiales = construirMateriales([c], {soloCircuito:true, nDif:1}, precios);
  const pres = presupuestar(materiales, {bocas:0, margen: numId("cr-margen") || configuracion.margen_insumos_default, incluyeVisita:false}, precios);
  ultimoCalculo = {circuitos:[c], contexto:{soloCircuito:true, nDif:1}, materiales, presupuesto:pres, meta:{tipo:"rapido"}};
  document.getElementById("calc-resultado").innerHTML =
    renderResultadoCircuito(c) + renderTablaMateriales(materiales) + renderResumenPresupuesto(pres) + accionesResultado();
}

function calcularObra(){
  const m2 = numId("co-m2") || 60;
  const bocasIlum = numId("co-ilum") || 0;
  const bocasToma = numId("co-toma") || 0;
  const Lmed = numId("co-long") || 18;
  const metodo = valId("co-metodo") || "embutido";
  const agrup = numId("co-agrup") || 3;
  const temp = numId("co-temp") || 30;
  const margen = numId("co-margen") || configuracion.margen_insumos_default;
  const incluyePAT = (document.getElementById("co-pat") || {}).checked;
  const incluyeVisita = (document.getElementById("co-visita") || {}).checked;

  const cargas = [];
  document.querySelectorAll(".co-esp:checked").forEach(chk=>{
    const row = chk.closest(".esp-row");
    const potencia = Number(row.querySelector(".esp-w").value) || 0;
    const longitud = Number(row.querySelector(".esp-l").value) || Lmed;
    if(potencia > 0) cargas.push({nombre: chk.dataset.nombre, potencia, longitud});
  });

  const g = gradoElectrificacion(m2);
  const circuitos = [];
  const nIUG = Math.max(1, Math.ceil(bocasIlum / 15));
  for(let i=0;i<nIUG;i++) circuitos.push(dimensionarCircuito({nombre:`Iluminación${nIUG>1?" "+(i+1):""}`, tipo:"IUG", I:10, L:Lmed, metodo, nAgrup:agrup, tempC:temp}));
  const nTUG = Math.max(1, Math.ceil(bocasToma / 15));
  for(let i=0;i<nTUG;i++) circuitos.push(dimensionarCircuito({nombre:`Tomacorrientes${nTUG>1?" "+(i+1):""}`, tipo:"TUG", I:16, L:Lmed, metodo, nAgrup:agrup, tempC:temp}));
  cargas.forEach(c=> circuitos.push(dimensionarCircuito({nombre:c.nombre, tipo:"ACU", P:c.potencia, L:c.longitud, metodo, nAgrup:agrup, tempC:temp})));

  const contexto = {bocasIlum, bocasToma, agrup, nDif:g.nDif, incluyePAT};
  const precios = getPrecios();
  const materiales = construirMateriales(circuitos, contexto, precios);
  const pres = presupuestar(materiales, {bocas: bocasIlum + bocasToma, margen, manoObra:"boca", incluyeVisita}, precios);
  ultimoCalculo = {circuitos, contexto, materiales, presupuesto:pres, grado:g, meta:{tipo:"obra", m2}};

  const alertasGlobales = [`Instalación grado ${g.grado} (por ${m2} m²): mínimo ${g.minCirc} circuitos y ${g.nDif} interruptor(es) diferencial(es) de 30 mA.`];
  if(circuitos.length < g.minCirc) alertasGlobales.push(`Calculaste ${circuitos.length} circuitos: la norma pide al menos ${g.minCirc} para este grado.`);
  alertasGlobales.push("Todos los circuitos deben quedar bajo diferencial de 30 mA (alta sensibilidad) y con puesta a tierra.");

  document.getElementById("calc-resultado").innerHTML =
    `<div class="card banner-info"><strong>Resumen:</strong> ${esc(resumenCalculo())}${badgeAlertas(alertasGlobales)}</div>` +
    renderTablaCircuitos(circuitos) +
    renderTablaMateriales(materiales) +
    renderResumenPresupuesto(pres) +
    accionesResultado();
}

// ------------------------------------------------------------------
// DELEGACIÓN DE EVENTOS — un solo listener por tipo, en lugar de ~37
// onclick inline con datos interpolados a mano. Más seguro (no hay
// superficie de XSS por atributos) y sin bugs de escaping cuando un
// texto trae comillas o backslashes.
// ------------------------------------------------------------------
function handleAction(action, el, ev){
  const d = el.dataset;
  switch(action){
    case "stop": break; // swallow: evita que el click burbujee al contenedor clickeable
    case "cerrar-toast": break; // lo maneja su propio listener
    case "ir-a-tab": if(ev) ev.preventDefault(); irATab(d.tab); break;
    case "abrir-ficha": abrirFicha(d.id); break;
    case "cerrar-modal": cerrarModal(); break;
    case "mover-orquestador": moverOrquestador(Number(d.idx), Number(d.dir)); break;
    case "cambiar-estado-visita": cambiarEstadoVisita(d.id, d.estado); break;
    case "abrir-modal-nueva-visita": abrirModalNuevaVisita(); break;
    case "guardar-nueva-visita": guardarNuevaVisita(); break;
    case "guardar-config": guardarConfig(); break;
    case "login": if(ev) ev.preventDefault(); login(); break;
    case "logout": logout(); break;
    case "toggle-pass": togglePass(d.target, el); break;
    case "facturar": facturar(d.id); break;
    case "add-checklist": addChecklistItem(d.id); break;
    case "quitar-checklist": quitarChecklistItem(d.id, Number(d.idx)); break;
    case "mostrar-prompt-pdf": mostrarPromptPDF(d.id); break;
    case "copiar-texto": copiarTexto(d.target, el); break;
    case "guardar-notas": guardarNotas(d.id); break;
    case "set-vista-prospectos": setVistaProspectos(d.vista); break;
    case "agenda-set-fecha": agendaFechaSeleccionada = d.value || null; render("agenda"); break;
    case "generar-prompt-escenario": generarPromptEscenario(); break;
    case "procesar-prospecto": procesarComoProspecto(); break;
    case "copiar-prompt": copiarPrompt(); break;
    case "generar-prompt-diagnostico": generarPromptDiagnostico(); break;
    case "generar-prompt-upsell": generarPromptUpsell(); break;
    case "generar-prompt-respuesta": generarPromptRespuesta(); break;
    case "calc-modo": {
      const modo = d.modo;
      const fObra = document.getElementById("calc-obra");
      const fRap = document.getElementById("calc-rapido");
      if(fObra) fObra.hidden = modo !== "obra";
      if(fRap) fRap.hidden = modo !== "rapido";
      el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b===el));
      const r = document.getElementById("calc-resultado"); if(r) r.innerHTML = "";
      break;
    }
    case "calc-obra": calcularObra(); break;
    case "calc-rapido": calcularRapido(); break;
    case "guardar-precios": guardarPrecios(); break;
    case "calc-guardar-cliente": guardarCalculoCliente(); break;
    case "calc-a-checklist": calcAChecklist(); break;
    case "calc-copiar": calcCopiar(); break;
    case "calc-pdf": calcPromptPDF(); break;
  }
}

function handleChange(change, el){
  const d = el.dataset;
  switch(change){
    case "toggle-checklist": {
      toggleChecklistItem(d.id, Number(d.idx));
      const span = el.closest("label")?.querySelector("span");
      if(span) span.classList.toggle("done", el.checked);
      break;
    }
    case "toggle-upsell": toggleUpsellElegido(d.id, d.texto); break;
    case "filtrar-prospectos": filtrarProspectos(); break;
    case "agenda-fecha-input": agendaFechaSeleccionada = el.value || null; render("agenda"); break;
    case "nv-cliente-sel": nvClienteSelChange(); break;
  }
}

document.body.addEventListener("click", (ev)=>{
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  handleAction(el.dataset.action, el, ev);
});

document.body.addEventListener("submit", (ev)=>{
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  handleAction(el.dataset.action, el, ev);
});

document.body.addEventListener("change", (ev)=>{
  const el = ev.target.closest("[data-change]");
  if(!el) return;
  handleChange(el.dataset.change, el);
});

document.body.addEventListener("input", (ev)=>{
  const el = ev.target.closest("[data-input]");
  if(!el) return;
  if(el.dataset.input === "filtrar-prospectos") filtrarProspectos();
});

document.addEventListener("keydown", (ev)=>{
  // Escape cierra cualquier modal abierto.
  if(ev.key === "Escape"){
    const root = document.getElementById("modal-root");
    if(root && root.children.length){ cerrarModal(); return; }
  }
  // Enter en el input de checklist agrega el material.
  const el = ev.target.closest && ev.target.closest("[data-keydown]");
  if(el && ev.key === "Enter" && el.dataset.keydown === "add-checklist"){
    ev.preventDefault();
    addChecklistItem(el.dataset.id);
  }
  // Enter/Espacio activan los elementos con role=button (tarjetas clickeables).
  if((ev.key === "Enter" || ev.key === " ")){
    const b = ev.target.closest && ev.target.closest('[data-action][role="button"], [role="button"][data-action]');
    if(b && b.getAttribute("role") === "button"){
      ev.preventDefault();
      handleAction(b.dataset.action, b, ev);
    }
  }
});

// ------------------------------------------------------------------
// ARRANQUE
// ------------------------------------------------------------------
cargando = true;
render("dashboard");                        // pinta el skeleton mientras carga
cargarDatos().then(()=> render(currentTab)); // re-render con datos reales o demo
</script>
