# Configuración del Motor de Jackpots

candidato: "Marco Ammazzalorso"
direccion_base: "Rosas Castillo 1698, Hurlingham, Provincia de Buenos Aires, Argentina"

# Embudo de investigación: dónde gastar esfuerzo.
# 1) descubrimiento_barato: lista amplia de candidatas por zona (búsqueda simple, sin verificación profunda)
# 2) filtrado: descarte rápido por homónimos, sin rubro compatible, sin ninguna señal
# 3) verificacion_profunda: solo para las que sobreviven el filtrado (fuentes, señales, negative signals)
# 4) investigacion_profunda: solo top candidatas (contact info, CV match detallado, redacción de outreach)
discovery:
  max_queries_per_zone: 60
  max_new_companies_per_zone: 200
  saturation_rounds: 5   # queries consecutivas con 0 empresas nuevas = zona saturada
  daily:
    max_queries: 300
    max_runtime_minutes: 180
  tanda_max_minutes: 120   # tope de seguridad por tanda manual (botón "Iniciar otra tanda"), no controla el modo automático
  scheduler:
    interval_minutes: 60     # cada cuánto se activa el modo búsqueda automático (1 vez por hora)
    queries_per_run: 8       # búsquedas por corrida horaria — calculado para durar semanas, no días, con el presupuesto de por vida
    max_minutes_per_run: 15  # tope de seguridad de tiempo por corrida (por si algo se cuelga)
  lifetime_query_budget: 2400   # tope de por vida, con margen sobre las 2500 gratis de Serper.dev

embudo:
  max_candidatas_por_zona: 15
  max_verificadas_profundamente_por_zona: 6
  max_jackpots_objetivo_por_zona: 4  # rango 2-4, curado, no masivo

umbrales:
  jackpot: 90
  muy_interesante: 80
  investigar: 65
  # por debajo de 65 -> descartar

reintentar_descartadas_dias: 90

transporte_prioritario:
  - {tipo: tren, nombre: "San Martín", prioridad: 1}
  - {tipo: colectivo, nombre: "182", prioridad: 2}
  - {tipo: colectivo, nombre: "320", prioridad: 3}
  - {tipo: colectivo, nombre: "237", prioridad: 4}
  - {tipo: colectivo, nombre: "463", prioridad: 5}
  # Prioridad = orden de investigación, no ranking de calidad. El motor puede
  # aprender con datos reales qué red produce mejores empresas.

caza_industrial:
  partidos: ["Moron", "Hurlingham", "Merlo", "Ituzaingo"]
  max_rubros_por_lote: 10   # combinaciones (partido, rubro CLAE) por corrida, para no gastar todo el presupuesto de una

zonas:
  cercana: ["Hurlingham", "Moron", "El Palomar", "Caseros", "Martin Coronado", "Villa Tesei"]
  media: ["Haedo", "Ramos Mejia", "William Morris", "Santos Lugares", "Bella Vista", "San Miguel", "Muñiz"]
  extendida: ["Jose C Paz", "Moreno", "Ciudadela", "Tres de Febrero"]

reglas_duras:
  - "Nunca inventar ni asumir datos de contacto: solo lo verificado con fuente citable."
  - "Nunca rastrear ni usar contacto personal de individuos: solo email/teléfono a nivel empresa."
  - "Nunca inflar o inventar experiencia del candidato en los emails: solo lo que dice el CV real."
  - "Señal negativa crítica y vigente -> descartar y decirlo explícitamente."
  - "Homónimo de otra provincia/país -> descartar y aclarar el motivo."
  - "Nada se envía automáticamente: outreach siempre pasa por revisión humana."
